version: "2"

run:
  allow-parallel-runners: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - bidichk
    - bodyclose
    - errcheck
    - goprintffuncname
    - govet
    - gosec
    - importas
    - ineffassign
    - makezero
    - prealloc
    - predeclared
    - promlinter
    - rowserrcheck
    - staticcheck
    - tagalign
    - testifylint
    - tparallel
    - unconvert
    - wastedassign
    - whitespace
    - unused
  disable:
    - errname
  settings:
    staticcheck:
      checks:
        - "all"
        - "-SA1019"
        - "-ST1000"
        - "-ST1003"
        - "-ST1005"
        - "-ST1012"
        - "-ST1020"
        - "-SA5010"


formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - "github.com/psyb0t/go-workflows"
